name: Build Artifact on Release Merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

jobs:
  build-android-artifact:
    name: Build Android Artifact
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'release/')
      )

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate local.properties for CI
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Ensure Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build app artifacts
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Collect APK/AAB outputs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print -exec cp {} dist/ \;

          if [[ -z "$(ls -A dist)" ]]; then
            echo "No APK/AAB artifact found."
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            release_ref="${{ github.event.pull_request.head.ref }}"
          else
            release_ref="${GITHUB_REF_NAME}"
          fi

          release_tag="${release_ref#release/}"
          release_tag="${release_tag//\//-}"
          echo "artifact_name=spotifish-${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
